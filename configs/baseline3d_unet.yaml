seed: 42
output_dir: ./outputs/baseline3d_unet

data:
  data_dir: ./data/BraTS2023
  preprocessed_dir: ./data/preprocessed3d_patches
  use_preprocessed: true
  mmap_preprocessed: true
  train_ratio: 0.7
  val_ratio: 0.1
  test_ratio: 0.2
  num_workers: 4
  pin_memory: true
  persistent_workers: true
  prefetch_factor: 4
  patch_size: [128, 128, 128]  # PyTorch order: D, H, W
  crop_mode: gt_tumor_center
  modalities: ["-t1n", "-t1c", "-t2w", "-t2f"]
  num_channels: 4
  num_classes: 4
  normalize_clip: [-5.0, 5.0]
  augment: true

model:
  backbone: unet3d
  features: [32, 64, 128]
  density_estimator:  # baseline 不使用；保留字段便于和 paper3d_unet.yaml 对齐
    hidden_dim: 256
    num_layers: 3
    feature_size: [16, 16, 16]

training:
  epochs: 175
  batch_size: 1
  lr: 3.0e-4
  weight_decay: 0.0
  optimizer: ranger
  scheduler: cosine
  amp: true
  grad_clip: 1.0
  log_interval: 10
  checkpoint_interval: 25

loss:
  use_biophysics: false
  lambda_pde: 0.0
  lambda_bc: 0.0
  d_range: [0.02, 1.5]
  rho_range: [0.002, 0.2]
  sample_parameters: voxel

inference:
  roi_size: [128, 128, 128]
  sw_batch_size: 1
  overlap: 0.5
  threshold: 0.5
  tta_flips: true
  eval_crop_mode: gt_tumor_center
