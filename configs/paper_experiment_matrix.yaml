ablations:
  activation_and_boundary:
    status: unet_configs_implemented_results_pending
    pending: full long-training result aggregation
    levels:
      activation: [sine, relu]
      boundary_condition: [enabled, disabled]
  modality_subset:
    status: unet_configs_implemented_results_pending
    pending: full long-training result aggregation
    levels:
      modalities:
        - ["-t1n", "-t2f"]
        - ["-t1n", "-t2w", "-t2f"]
        - ["-t1n", "-t1c", "-t2w", "-t2f"]
  training_set_fraction:
    status: unet_configs_implemented_results_pending
    pending: full long-training result aggregation
    levels:
      train_fraction: [0.25, 0.5, 0.75]
      full_training_set_configs: [configs/paper3d_unet.yaml, configs/baseline3d_unet.yaml]
  segmentation_loss:
    status: unet_configs_implemented_results_pending
    pending: full long-training result aggregation
    levels:
      loss: [dice, dice_ce, focal, jaccard]
