  - name: baseline_three_modalities_t1n_t2w_t2f
    ablation: modality_subset
    status: implemented
    config: configs/unet_ablations/unet_baseline_modalities_t1n_t2w_t2f.yaml
  - name: quarter_training_set
    ablation: training_set_fraction
    status: implemented
    config: configs/unet_ablations/unet_biophy_train_fraction_25.yaml
  - name: baseline_quarter_training_set
    ablation: training_set_fraction
    status: implemented
    config: configs/unet_ablations/unet_baseline_train_fraction_25.yaml
  - name: half_training_set
    ablation: training_set_fraction
    status: implemented
