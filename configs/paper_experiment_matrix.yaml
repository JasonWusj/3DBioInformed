  - name: three_quarter_training_set
    ablation: training_set_fraction
    status: implemented
    config: configs/unet_ablations/unet_biophy_train_fraction_75.yaml
  - name: baseline_three_quarter_training_set
    ablation: training_set_fraction
    status: implemented
