paper:
  title: Biophysics Informed Pathological Regularisation for Brain Tumour Segmentation
  source: arXiv-2403.09136v3/section/experiments.tex

common_setup:
  dataset: BraTS 2023 official training partition
  split: "7:1:2 train/val/test"
  split_seed: 42
  patch_size: [128, 128, 128]
  modalities: ["-t1n", "-t1c", "-t2w", "-t2f"]
  epochs: 175
  batch_size: 1
  optimizer: ranger
  learning_rate: 0.0003
  scheduler: cosine
  amp: true
  final_model_for_test: true
  metrics: [dice, hd95]
  regions: [TC, WT, ET]

main_table:
  - method: UNet
    backbone: UNet
    variant: baseline
    status: implemented
    config: configs/baseline3d_unet.yaml
    paper_dice: [90.68, 92.29, 87.28]
    paper_hd95: [6.16, 7.85, 10.99]
  - method: UNet (Biophy)
    backbone: UNet
    variant: biophysics
    status: implemented
    config: configs/paper3d_unet.yaml
    paper_dice: [91.83, 92.34, 88.26]
    paper_hd95: [3.99, 6.94, 7.47]
