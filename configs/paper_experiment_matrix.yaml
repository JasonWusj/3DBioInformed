    ablation: activation_and_boundary
    status: implemented
    config: configs/unet_ablations/unet_biophy_relu.yaml
  - name: sine_without_boundary_condition
    ablation: activation_and_boundary
    status: implemented
    config: configs/unet_ablations/unet_biophy_no_bc.yaml
  - name: relu_without_boundary_condition
    ablation: activation_and_boundary
    status: implemented
    config: configs/unet_ablations/unet_biophy_relu_no_bc.yaml
  - name: two_modalities_t1n_t2f
    ablation: modality_subset
    status: implemented
    config: configs/unet_ablations/unet_biophy_modalities_t1n_t2f.yaml
  - name: baseline_two_modalities_t1n_t2f
    ablation: modality_subset
